[workspace]
members = ["e2e", "macros"]
default-members = [".", "macros"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/dkluhzeb/crap-cms"
homepage = "https://github.com/dkluhzeb/crap-cms"
authors = ["dkluhzeb"]
readme = "README.md"

[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["form", "macros", "query", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "compression-br", "trace"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util", "io-std"] }

# Database
r2d2 = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
r2d2_sqlite = "0.32"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
deadpool = { version = "0.12", features = ["managed", "rt_tokio_1"] }
parking_lot = "0.12"

# Templates
handlebars = { version = "6", features = ["dir_source"] }
include_dir = "0.7"

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["sync"] }

# Lua
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "send"] }

# Config & CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dialoguer = "0.12"
console = "0.16"
indicatif = "0.18"
toml = "1.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04", "preserve_order"] }

# Auth
argon2 = "0.5"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "avif"] }
webp = "0.3"
# EXIF parsing for orientation handling. The `image` crate decodes pixel
# data but ignores EXIF metadata, so portrait photos from phones (which
# encode rotation via the orientation tag rather than rotating pixels)
# would otherwise display sideways.
kamadak-exif = "0.6"

# HTTP client (blocking — used in Lua spawn_blocking context)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Crypto
ring = "0.17"
base64 = "0.22"
rand = "0.9"
aes-gcm = "0.10"

# Cron scheduling
cron = "0.16"

# HTTP/2 cleartext (h2c) support
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http2", "server-auto"] }

# Tower (rate limiting, timeouts)
tower = { version = "0.5", features = ["util", "timeout"] }

# URL parsing
url = "2"

# Utilities
nanoid = "0.5"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
ipnet = "2"
anyhow = "1"

# Process management (Unix signals)
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
form_urlencoded = "1.2.2"
regex = "1.12.3"
dashmap = "6.1.0"
subtle = "2.6.1"
infer = "0.19.0"
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic-health = "0.14.5"
chrono-tz = "0.10"
sha2 = "0.11"
semver = "1"
similar = { version = "3.1.0", features = ["text"] }

# Storage / cache backends (optional in main crate)
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
redis = { version = "1", features = ["tokio-comp"] }

# Dev / test
tempfile = "3"
http-body-util = "0.1"
scraper = "0.26"

# Build
tonic-prost-build = "0.14"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)', 'cfg(tarpaulin_include)', 'cfg(feature, values("sqlite", "postgres", "s3-storage", "redis"))'] }

[workspace.lints.clippy]
# Pedantic at warn-level. We fix what we can — suppressions get added
# below only after we've examined the warnings and decided the rule
# isn't worth following in this codebase.
pedantic = { level = "warn", priority = -1 }

# crap-cms is a binary, not a library. The lint exists to keep public
# library APIs hasher-generic so downstream crates can pass HashMaps
# with custom hashers (AHash, FxHash, …). We have no external callers,
# every HashMap in this crate uses the default RandomState, and the
# `DocumentFields` newtype would need a hasher type param threaded
# through dozens of files for zero practical flexibility.
implicit_hasher = "allow"

# The lint targets positional bool soup. All our hits are named-field
# records: Serialize/JsonSchema view models accessed by name in
# Handlebars (`{{#if perms.read}}`), TOML config records
# (`PasswordPolicy`, `Auth`, `FieldDefinition`), clap-derived CLI
# options (`CollectionOptions`), and struct-of-args bundles we
# created specifically to defeat positional bool args
# (`CursorFlags`, `PaginationInputs`, `FindDocumentsInput`).
# Refactoring would break serde formats, template access, or CLI
# surfaces — and the struct-of-args bundles literally exist to
# undo `needless_pass_by_value`. No call site uses positional booleans.
struct_excessive_bools = "allow"

[package]
name = "crap-cms"
description = "Headless CMS in Rust with Lua hooks, gRPC API, and HTMX admin UI"
keywords = ["cms", "headless", "grpc", "lua", "htmx"]
categories = ["web-programming", "database"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
default-run = "crap-cms"

[lints]
workspace = true

[[bin]]
name = "crap-cms"
path = "src/main.rs"

[dependencies]
# Web framework
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true

# Database (optional, gated by features)
r2d2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
r2d2_sqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
deadpool = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

# Templates
handlebars.workspace = true
include_dir.workspace = true

# gRPC
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
tonic-reflection.workspace = true
tokio-stream.workspace = true

# Lua
mlua.workspace = true

# Config & CLI
clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true
console.workspace = true
indicatif.workspace = true
toml.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

# Auth
argon2.workspace = true
jsonwebtoken.workspace = true

# Email
lettre.workspace = true

# Image processing
image.workspace = true
webp.workspace = true
kamadak-exif.workspace = true

# HTTP client
reqwest.workspace = true

# Crypto
ring.workspace = true
base64.workspace = true
rand.workspace = true
aes-gcm.workspace = true

# Cron
cron.workspace = true

# HTTP/2
hyper.workspace = true
hyper-util.workspace = true

# Tower
tower.workspace = true

# URL
url.workspace = true

# Utilities
nanoid.workspace = true
dirs.workspace = true
chrono.workspace = true
mime_guess.workspace = true
ipnet.workspace = true
anyhow.workspace = true

# Process management
libc.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
form_urlencoded.workspace = true
regex.workspace = true
dashmap.workspace = true
subtle.workspace = true
infer.workspace = true
tokio-util.workspace = true
tonic-health.workspace = true
chrono-tz.workspace = true
sha2.workspace = true
semver.workspace = true
similar.workspace = true

# Storage / cache backends (optional, gated by features)
rust-s3 = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

# Workspace member — proc-macro crate. Currently a stub; will host
# `#[derive(LuaAnnotation)]` and `#[derive(ProtoMessage)]` derives.
crap-cms-macros = { path = "macros" }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:r2d2", "dep:r2d2_sqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:deadpool", "dep:parking_lot"]
s3-storage = ["dep:rust-s3"]
redis = ["dep:redis"]

[dev-dependencies]
tempfile.workspace = true
http-body-util.workspace = true
scraper.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[profile.dev.package.image]
opt-level = 2
[profile.dev.package.webp]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
